name: site_buddy
description: "Site Buddy — focus timer for tradespeople. Clock in, let the mini-buddy crew guard your apps, and build out your workshop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so typography matches across platforms and the web build works
  # fully offline instead of downloading Roboto from the gstatic CDN.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
